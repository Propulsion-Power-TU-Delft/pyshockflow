[GEOMETRY]

; Length in meters of the whole domain [m]
LENGTH = 10

; Location of the interface [m]
INTERFACE_LOCATION = 5

; Simulation type topology
TOPOLOGY = default


[SIMULATION]

; Number of points in the whole domain (equidistant points)
NUMBER_POINTS = 500

; Final time of the simulation [s]
TIME_MAX = 0.00275

; Initial densities in the left and right state [kg/m3]
DENSITY_LEFT = 348.8
DENSITY_RIGHT = 3.488

; Initial velocities in the left and right state [m/s]
VELOCITY_LEFT = 0.0
VELOCITY_RIGHT = 0.0

; Initial pressure in the left and right state [Pa]
PRESSURE_LEFT = 73760000
PRESSURE_RIGHT = 737600

; Advection scheme (Roe_Arabi, Roe_Vinokur, Godunov)
NUMERICAL_SCHEME = Roe_arabi
ENTROPY_FIX_ACTIVE = yes

; Look-Up Table acceleration: Disabled (exact analytical Helmholtz EoS)
USE_LUT = no

; Boundary conditions
BOUNDARY_CONDITION_LEFT = reflective
BOUNDARY_CONDITION_RIGHT = reflective

; Max CFL to be used (< 1)
CFL_MAX = 0.5


[FLUID]

; Name of the fluid, according to CoolProp
FLUID_NAME = CO2

; Model of the fluid to be used (ideal, real)
FLUID_MODEL = real
FLUID_LIBRARY = CoolProp


[OUTPUT]

; Folder to save result file
FOLDER_NAME = Results

; Case name for output file
FILE_NAME = real_exact
