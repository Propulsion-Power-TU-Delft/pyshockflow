[GEOMETRY]

; Length in meters of the whole domain [m]
LENGTH = 3.0284

; Location of the interface [m]
INTERFACE_LOCATION = 3.01

; Simulation type topology (default, nozzle). Default is the standard shock tube, nozzle requires a nozzle csv file where info about the area is stored
TOPOLOGY = nozzle

; Location of the nozzle csv file with the distribution of areas along x. Same coordinate system and reference of the tube
NOZZLE_FILEPATH = ../01_Preprocess/nozzle_ratio_0.450.csv

; Reference area (the tube area)
REFERENCE_AREA = 7.210661998336e-04


[SIMULATION]

; Number of points in the whole domain (equidistant points)
NUMBER_POINTS = 500

; Specifyif mesh needs to be refined (yes/true, or no/false). Default is False
MESH_REFINEMENT = yes

; Specify axial locations of grid refinement
X_START_REFINEMENT = 2.997812
X_END_REFINEMENT = 3.0285

; Specify number of points that lie in the refinement. Must be of course < than total number of points
NUMBER_POINTS_REFINEMENT = 200

; Specify if you want to adapt the grid closed to the refinement extremities. No significant differences from refinement without adaptation
ADAPT_MESH_REFINEMENT = yes



; Final time of the simulation [s]
TIME_MAX = 0.10

; Initial densities in the left and right state
TEMPERATURE_LEFT = 294.15
TEMPERATURE_RIGHT = 294.15

; Initial velocities in the left and right state
VELOCITY_LEFT = 0.0
VELOCITY_RIGHT = 0.0

; Initial pressure in the left and right state
PRESSURE_LEFT = 7.67E+05
PRESSURE_RIGHT = 1E+03

; Advection scheme (Roe)
NUMERICAL_SCHEME = Roe

; Boundary conditions
BOUNDARY_CONDITION_LEFT = reflective
BOUNDARY_CONDITION_RIGHT = tank

; 0D Tank Parameters
TANK_VOLUME = 1e-1
TANK_INITIAL_PRESSURE = 1E+03
TANK_INITIAL_TEMPERATURE = 294.15
TANK_THERMAL_MODE = adiabatic

; Max CFL to be used <1)
CFL_MAX = 0.95

; Wall friction activation (True, False)
WALL_FRICTION_ACTIVE = True
FRICTION_COEFFICIENT = 0.0


[FLUID]

; Name of the fluid, according to Coolprop
FLUID_NAME = air

; Model of the fluid to be used (ideal, real)
FLUID_MODEL = ideal

; FLuid gamma
FLUID_GAMMA = 1.4

; Gas constant
GAS_R_CONSTANT = 287.05


[OUTPUT]

; Folder to save result file
FOLDER_NAME = Results

; Case name for output file
FILE_NAME = tank_1e-1

OUTPUT_FREQUENCY = 100
